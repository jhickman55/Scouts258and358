<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Capture · Homepage</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    @keyframes topoDrift { from { transform: translateX(0) translateY(0); } to { transform: translateX(-80px) translateY(-40px); } }
    body { margin:0; background:#1a2419; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="components/icons.jsx"></script>
  <script type="text/babel" src="components/variation-b.jsx"></script>
  <script type="text/babel" src="components/supporting-pages.jsx"></script>
  <script type="text/babel">
    const params = new URLSearchParams(location.search);
    const page = params.get('page') || 'home';
    const Comp = page === 'newscout' ? NewScoutPage : page === 'calendar' ? CalendarPage : page === 'contact' ? ContactPage : VariationB;
    ReactDOM.createRoot(document.getElementById('root')).render(<Comp />);
  </script>
</body>
</html>
