---
layout: default
---

<!-- Loading indicator while checking auth -->
<section class="auth-loading" id="auth-loading">
  {% include topo-bg.html tone="dim" %}
  <div class="auth-loading__inner">
    <div class="spinner" aria-hidden="true"></div>
    <div class="auth-loading__label">Checking login…</div>
  </div>
</section>

<!-- Protected content - hidden until auth is confirmed -->
<div id="protected-content" style="display: none;">
  {{ content }}
</div>
